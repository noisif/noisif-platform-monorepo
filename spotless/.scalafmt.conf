version = 3.8.3
runner.dialect = scala213
align.preset = more
maxColumn = 100
rewrite.rules = [Imports]
rewrite.imports.sort = ascii
rewrite.imports.groups = [
  ["com\\..*"],
  ["org\\..*"],
  ["xyz\\.noisif\\..*"],
  ["(?!com\\.|org\\.|xyz\\.noisif\\.|jakarta\\.|java\\.|javax\\.|scala\\.).*"],
  ["jakarta\\..*"],
  ["java\\..*"],
  ["javax\\..*"],
  ["scala\\..*"]
]
