name: Generate and publish documentation page

on:
  push:
    branches:
      - "master"
    paths:
      - ".github/workflows/publish-docs.yml"
      - "dokka/**"
      - "ns*/**"
      - "build.gradle.kts"
      - "DOKKA.md"
      - "settings.gradle.kts"
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JRE 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Set short commit hash as NS_VERSION
        run: echo "NS_VERSION=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Generate Dokka documentation
        env:
          NS_OSS_INDEX_USER: ${{ secrets.NS_OSS_INDEX_USER }}
          NS_OSS_INDEX_TOKEN: ${{ secrets.NS_OSS_INDEX_TOKEN }}

        run: ./gradlew clean dokkaGenerate

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy docs/dokka --project-name=noisif-platform-docs --branch=master
